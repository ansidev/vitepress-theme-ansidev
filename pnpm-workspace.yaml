packages:
  - packages/*

allowBuilds:
  esbuild: true
  sharp: true

onlyBuiltDependencies:
  - esbuild

overrides:
  'vue': '3.5.45'
  vite@*: 'catalog:'
catalog:
  vite: npm:@voidzero-dev/vite-plus-core@1.6.0
  vite-plus: 1.6.0
peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: '*'
